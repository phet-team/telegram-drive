# ==============================================================================
# Telegram Cloud Storage — Community Self-Hosted Docker Compose
# One-click deployment: Frontend (Vue 3 + Nginx) + Backend (Django + Telethon) + PostgreSQL 16
# ==============================================================================

services:
  # ── 1. PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: telegram-drive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-telegram_drive}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-telegram_drive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drive-network

  # ── 2. Django Backend API & Telegram MTProto Engine ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telegram-drive-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-telegram_drive}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-mtproto}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_STORAGE_CHAT_ID: ${TELEGRAM_STORAGE_CHAT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEFAULT_CHUNK_SIZE_MB: ${DEFAULT_CHUNK_SIZE_MB:-8}
      MIN_CHUNK_SIZE_MB: ${MIN_CHUNK_SIZE_MB:-4}
      MAX_CHUNK_SIZE_MB: ${MAX_CHUNK_SIZE_MB:-32}
    networks:
      - drive-network

  # ── 3. Frontend Web Interface & Reverse Proxy (Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_TELEGRAM_BOT_ID: ${VITE_TELEGRAM_BOT_ID:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_CHUNK_SIZE_MB: ${VITE_CHUNK_SIZE_MB:-8}
    container_name: telegram-drive-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - drive-network

volumes:
  pgdata:
    driver: local

networks:
  drive-network:
    driver: bridge
